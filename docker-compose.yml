services:
  postgres:
    image: postgres:16-alpine
    container_name: assurance-postgres
    environment:
      POSTGRES_DB: assurance
      POSTGRES_USER: assurance
      POSTGRES_PASSWORD: assurance
    ports:
      - "5433:5432"
    volumes:
      - assurance-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U assurance -d assurance"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: assurance-backend
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/assurance
      SPRING_DATASOURCE_USERNAME: assurance
      SPRING_DATASOURCE_PASSWORD: assurance
      CLIENT_BASE_URL_LOCAL: http://localhost:4600
      JAVA_OPTS: -Xms256m -Xmx512m
    ports:
      - "8075:8075"

volumes:
  assurance-postgres-data:
